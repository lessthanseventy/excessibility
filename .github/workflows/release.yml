name: Release

# Deliberate, human-gated release path (issues #176, #187). Run this manually
# AFTER the release PR (version bump + README + CHANGELOG) has merged to main and
# all required checks are green. It creates the version tag for the current
# @version and a GitHub release.
#
# Safety invariants (#187):
#   * Only the default branch (main) may be released — an arbitrary dispatch ref
#     is refused.
#   * The release commit must still be the tip of origin/main at run time.
#   * CI and Version Check must have SUCCEEDED for that exact SHA — the real
#     PostgreSQL + browser coverage lives there, so the release never relies on a
#     reduced local `mix test`.
#   * CHANGELOG must carry a dated `## [<version>]` section and an empty
#     [Unreleased], so release notes never misclassify shipped fixes.
#   * Tags are immutable and NEVER force-moved. A tag that already targets the
#     exact release SHA makes a rerun resume (it (re)creates the missing GitHub
#     release); a tag targeting any other SHA aborts.
#
# Hex publication runs at the end of this job, behind the HEX_API_KEY secret and
# the `publish_hex` input. It is deliberately LAST: everything above it is a
# guard or is reversible, and a Hex release is effectively permanent (a public
# version can only be replaced within one hour of first publication).
#
# One-time setup:
#   1. hex.pm -> Dashboard -> Keys -> generate a key with `api:write`.
#   2. Repo -> Settings -> Secrets and variables -> Actions -> new repository
#      secret named HEX_API_KEY.
# Hex has no OIDC/trusted-publishing support, so a stored key is the only
# mechanism available. Rotate it from the same hex.pm page if it ever leaks.

on:
  workflow_dispatch:
    inputs:
      publish_hex:
        description: "Publish the package and docs to Hex.pm after tagging"
        type: boolean
        default: true

permissions:
  contents: write
  # Minimal read scope to verify CI / Version Check runs for the release SHA.
  actions: read

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest

    steps:
      - name: Refuse any ref except the default branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release must be dispatched from main; got '$GITHUB_REF'. Re-dispatch with the default branch selected."
            exit 1
          fi
          echo "✓ Dispatched from main."

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require HEAD to be the current tip of origin/main
        run: |
          git fetch --quiet origin main
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          echo "release SHA:     $head_sha"
          echo "origin/main tip: $main_sha"
          if [ "$head_sha" != "$main_sha" ]; then
            echo "::error::Release SHA $head_sha is not the current tip of origin/main ($main_sha). main moved after dispatch — re-run once it settles."
            exit 1
          fi
          echo "✓ Releasing the current tip of main."

      - name: Extract version from mix.exs
        id: version
        run: |
          VERSION=$(grep '@version "' mix.exs | sed 's/.*@version "\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Require a dated, folded CHANGELOG for this version
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if ! grep -Eq "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated '## [$VERSION] - YYYY-MM-DD' section. Fold the release entries out of [Unreleased] into a dated v$VERSION section before releasing."
            exit 1
          fi

          # The [Unreleased] section (everything up to the next '## [') must carry
          # no entries at release time — otherwise shipped fixes would be
          # misclassified as unreleased in the generated notes (#187).
          unreleased="$(awk '/^## \[Unreleased\]/{f=1; next} /^## \[/{f=0} f' CHANGELOG.md)"
          if echo "$unreleased" | grep -Eq '^\s*[-*]\s'; then
            echo "::error::CHANGELOG.md [Unreleased] still lists entries. Fold them into the dated v$VERSION section before releasing:"
            echo "$unreleased" | grep -E '^\s*[-*]\s'
            exit 1
          fi
          echo "✓ CHANGELOG has a dated v$VERSION section and an empty [Unreleased]."

      - name: Verify CI and Version Check succeeded for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$GITHUB_SHA"
          for wf in ci.yml version-check.yml; do
            count="$(gh api "repos/${{ github.repository }}/actions/workflows/$wf/runs?head_sha=$sha&status=success" --jq '.total_count')"
            if [ "${count:-0}" -lt 1 ]; then
              echo "::error::No successful run of $wf for $sha. Wait for the required checks to pass on the release commit (this is where the PostgreSQL + browser coverage runs)."
              exit 1
            fi
            echo "✓ $wf succeeded for $sha ($count run(s))."
          done

      # Everything Hex-related that can fail is checked BEFORE a tag exists, so a
      # bad key or an unbuildable package never leaves a half-done release.
      - name: Set up Elixir
        if: inputs.publish_hex
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '27'
          install-rebar: true
          install-hex: true

      - name: Preflight the Hex publish
        id: hex
        if: inputs.publish_hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE="$(grep -m1 'app: :' mix.exs | sed 's/.*app: :\([a-z0-9_]*\).*/\1/')"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

          if [ -z "$HEX_API_KEY" ]; then
            echo "::error::HEX_API_KEY secret is not set. Generate a key with the api:write permission at https://hex.pm/dashboard/keys and add it as a repository secret, or re-dispatch with publish_hex disabled to tag only."
            exit 1
          fi
          echo "✓ HEX_API_KEY is present."

          # Already on Hex is NOT an error: it is the resumable case (a version
          # published by hand, or a rerun after the publish step failed). Record
          # it and skip the publish rather than aborting the tag/release.
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://hex.pm/api/packages/$PACKAGE/releases/$VERSION")"
          if [ "$status" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$PACKAGE $VERSION is already on Hex — the publish step will be skipped, but tagging continues."
          elif [ "$status" = "404" ]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "✓ $PACKAGE $VERSION is not yet on Hex."
          else
            echo "::error::Unexpected HTTP $status from hex.pm while checking whether $PACKAGE $VERSION is published. Refusing to guess."
            exit 1
          fi

      - name: Verify the package builds
        if: inputs.publish_hex && steps.hex.outputs.already_published == 'false'
        run: |
          mix deps.get
          # --dry-run runs the same local checks as a real publish (package
          # surface, metadata, docs build) and uploads nothing.
          mix hex.publish --dry-run --yes
          echo "✓ Package and docs build; local publish checks pass."

      - name: Resolve tag state (immutable; reruns resume)
        id: tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sha="$GITHUB_SHA"

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            tag_sha="$(git rev-parse "v$VERSION^{commit}")"
            if [ "$tag_sha" = "$sha" ]; then
              echo "✓ Tag v$VERSION already targets the release SHA — resuming to create the missing GitHub release."
              echo "create_tag=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Tag v$VERSION exists but targets $tag_sha, not the release SHA $sha. Tags are immutable — bump @version, or delete the abandoned tag deliberately (out of band) before re-releasing this version."
              exit 1
            fi
          else
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.tag.outputs.create_tag == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          echo "✓ Created and pushed tag v$VERSION"

      - name: Create GitHub release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "✓ GitHub release v$VERSION already exists — nothing to do."
          else
            gh release create "v$VERSION" \
              --target "$GITHUB_SHA" \
              --title "v$VERSION" \
              --notes "See [CHANGELOG.md](https://github.com/lessthanseventy/excessibility/blob/v$VERSION/CHANGELOG.md) for details."
            echo "✓ Created GitHub release v$VERSION"
          fi

      - name: Publish to Hex.pm
        if: inputs.publish_hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ "${{ steps.hex.outputs.already_published }}" = "true" ]; then
            echo "✓ ${{ steps.hex.outputs.package }} $VERSION is already on Hex — nothing to publish."
            exit 0
          fi
          mix hex.publish --yes
          echo "✓ Published ${{ steps.hex.outputs.package }} $VERSION and its docs to Hex."

      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "### Released v$VERSION"
            echo ""
            echo "- Tag: \`v$VERSION\` -> \`$GITHUB_SHA\`"
            echo "- GitHub release: https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
            if [ "${{ inputs.publish_hex }}" = "true" ]; then
              if [ "${{ steps.hex.outputs.already_published }}" = "true" ]; then
                echo "- Hex: already published, skipped"
              else
                echo "- Hex: https://hex.pm/packages/${{ steps.hex.outputs.package }}/$VERSION"
              fi
            else
              echo "- Hex: skipped (publish_hex disabled) — run \`mix hex.publish\` locally when ready"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
